version: '3.9'
services:
  keyword-service:
    container_name: keyword-service
    build:
      context: .
      dockerfile: ./services/keyword_service/Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - ./config/keyword.env
    environment:
      - TZ=:Asia/Taipei
      - PYTHONPATH=/app
    volumes:
      - .:/app
    depends_on:
      - mongo

  mongo:
    image: mongo:4.4
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=shopee
      - TZ=:Asia/Taipei
      - MONGO_INITDB_ROOT_USERNAME=
      - MONGO_INITDB_ROOT_PASSWORD=
    volumes:
      - ./data/mongo:/data/db
    logging:
      driver: 'json-file'
      options:
        max-file: '10'
        max-size: '1024m'